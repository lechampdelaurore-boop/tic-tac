<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic-tac</title>
<meta name="description" content="Apprendre à lire l'heure et à calculer des durées : horloge à aiguilles, conversions, droite des bonds.">
<meta name="theme-color" content="#FFF4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1933" media="(prefers-color-scheme: dark)">
<meta name="appli-marc" content="oui">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tic-tac">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ==========================================================================
   Charte commune des applis — v1 (1er novembre 2026)
   À coller en haut du <style> de chaque index.html (pas de fichier externe :
   chaque appli reste un seul index.html). Voir charte.md pour les règles.
   Polices : copier design/fonts/ dans le dossier fonts/ de l'appli.
   ========================================================================== */

@font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('fonts/fredoka-latin.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 200 1000; font-display: swap; src: url('fonts/nunito-latin.woff2') format('woff2'); }

/* ---------- 1. Jetons (couleurs, formes, polices) ---------- */
:root {
  color-scheme: light dark;

  /* Fond et surfaces */
  --bg: #FFF4FA;            /* haut du dégradé de fond (rose très pâle) */
  --bg2: #EEF4FF;           /* bas du dégradé (bleu très pâle) */
  --surface: #FFFFFF;       /* cartes, bulles, boutons doux */
  --surface2: #F4F1FF;      /* touches du clavier, zones calmes */
  --track: #E4DEF7;         /* fond des barres de progression */

  /* Encre : même violet nuit que le contour des 30 personnages */
  --ink: #2B2340;           /* texte */
  --muted: #6B6190;         /* texte secondaire */
  --line: #2B2340;          /* contours et ombres dures */

  /* Rôles de couleur (un rôle = une couleur, dans toutes les applis) */
  --action: #3B5BFF;        /* LE bouton principal (Commencer, Valider, Suivant) */
  --on-action: #FFFFFF;
  --pompon: #FF6FA5;        /* rose de Pompon : cœurs, « Nouveau », bouton ▶ de l'accueil */
  --on-pompon: #FFFFFF;
  --sun: #FFD45C;           /* étoiles, récompenses, astuces, focus clavier */
  --on-sun: #2B2340;
  --good: #2BC48A;          /* bonne réponse, OK */
  --on-good: #0B2E20;
  --tint-good: #D8F6E8;     /* carte réussie */
  --retry: #FFB38A;         /* « à retenter » (jamais de rouge) */
  --tint-retry: #FFE4D6;    /* carte à retenter */

  /* 6 pastels (pastilles A-F, cartes de l'accueil, zones de carte) */
  --p-rose: #FFD2E3;
  --p-soleil: #FFE9A3;
  --p-menthe: #C6F1E2;
  --p-lilas: #E0D6FF;
  --p-ciel: #CDEBFF;
  --p-peche: #FFDCC8;

  /* 6 couleurs vives (icônes, personnages, confettis) */
  --v-rose: #FF6FA5;
  --v-soleil: #FFD45C;
  --v-menthe: #8EE3C8;
  --v-lilas: #C9B6FF;
  --v-ciel: #9AD7FF;
  --v-peche: #FFB38A;

  /* Lecture (applis de français) */
  --syl-a: #2F4FE0;         /* syllabes alternées : bleu… */
  --syl-b: #C92A62;         /* …et framboise */
  --muette: #A39DB8;        /* lettre muette grisée */
  --son-cle: #FFE9A3;       /* fond de la lettre qui décide du son */
  --ligne-b: #EEF1FF;       /* une ligne sur deux */

  /* Polices */
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;  /* titres, boutons, chiffres */
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; /* texte */
  --lecture: 'Nunito', Arial, sans-serif;                        /* texte à lire */

  /* Formes */
  --bord: 3px;
  --r-carte: 28px;
  --r-btn: 22px;
  --r-touche: 18px;
  --r-pastille: 999px;
  --ombre: 0 5px 0 var(--line);
  --ombre-carte: 0 6px 0 var(--line);
  --toucher: 56px;          /* hauteur mini d'un bouton */

  /* Mouvement */
  --ressort: cubic-bezier(.3, 1.6, .5, 1);
  --deco: .55;              /* opacité des petits dessins de fond */
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1933;
    --bg2: #171B36;
    --surface: #2B2448;
    --surface2: #352D57;
    --track: #3D3466;
    --ink: #FBEFFF;
    --muted: #C3B7E8;
    --line: #120E22;        /* le contour reste sombre, même la nuit */
    --action: #7F98FF;
    --on-action: #120E22;
    --pompon: #FF8DB9;
    --on-pompon: #2A0F1E;
    --good: #3DDC97;
    --tint-good: #1D4A3D;
    --retry: #FF9F7A;
    --tint-retry: #5A3326;
    --p-rose: #5A3552;
    --p-soleil: #5A4A24;
    --p-menthe: #24504A;
    --p-lilas: #433A72;
    --p-ciel: #283F68;
    --p-peche: #5A3A2E;
    --syl-a: #9DB0FF;
    --syl-b: #FF8DB4;
    --muette: #7D7499;
    --son-cle: #5A4A24;
    --ligne-b: #262046;
    --deco: .25;
  }
}

/* ---------- 2. Base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg2); }
body {
  margin: 0;
  min-height: 100dvh;
  background: linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%) no-repeat;
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; }
h1 { font-size: clamp(1.6rem, 7vw, 2.4rem); }
h2 { font-size: 1.4rem; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 3. En-tête commun : 🏠 · titre · ⚙ ---------- */
.entete { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.entete .titre { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.25rem; text-align: center; }
.rond {                    /* bouton rond (🏠, ⚙, ✕, son) */
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; font-size: 22px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: var(--bord) solid var(--line); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.rond:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- 4. Boutons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: var(--toucher); padding: 10px 22px;
  font: 600 1.2rem var(--display); text-decoration: none;
  color: var(--ink); background: var(--surface);
  border: var(--bord) solid var(--line); border-radius: var(--r-btn);
  box-shadow: var(--ombre); cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: var(--ombre); }
.btn-action { background: var(--action); color: var(--on-action); }   /* un seul par écran */
.btn-soleil { background: var(--sun); color: var(--on-sun); }         /* bonus, installer */
.btn-ok { background: var(--good); color: var(--on-good); }
.btn-petit { width: auto; min-height: 44px; padding: 6px 16px; font-size: 1rem; border-radius: var(--r-pastille); box-shadow: 0 4px 0 var(--line); }

/* ---------- 5. Cartes, bulles, pastilles ---------- */
.carte {
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-carte); box-shadow: var(--ombre-carte); padding: 20px;
}
.carte.reussie { background: var(--tint-good); }
.carte.a-retenter { background: var(--tint-retry); }
.bulle {                   /* bulle de dialogue d'un personnage */
  position: relative; background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: 26px; box-shadow: var(--ombre); padding: 12px 16px;
}
.pastille {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 12px;
  border: 2px solid var(--line); border-radius: var(--r-pastille);
  background: var(--surface); font: 700 .9rem var(--body); white-space: nowrap;
}
.pastille.soleil { background: var(--p-soleil); }
.pastille.rose { background: var(--p-rose); }
.pastille.menthe { background: var(--p-menthe); }
.badge-nouveau {
  display: inline-block; background: var(--sun); color: var(--on-sun);
  border: var(--bord) solid var(--line); border-radius: var(--r-pastille);
  padding: 1px 10px 2px; font: 700 .85rem var(--display); transform: rotate(4deg);
}
.etiquette { font: 800 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.astuce {
  background: var(--sun); color: var(--on-sun); border-radius: 18px;
  padding: 10px 14px; font-weight: 700;
}
.astuce::before { content: '💡 '; }

/* ---------- 6. Progression ---------- */
.barre { height: 18px; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); overflow: hidden; }
.barre > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: inherit; transition: width .4s var(--ressort); }

/* ---------- 7. Choix A-F (QCM) et clavier ---------- */
.choix {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--toucher);
  padding: 8px 14px; text-align: left; font: 600 1.1rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.choix:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choix .lettre {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center;
  border: 2px solid var(--line); border-radius: 10px; font-size: .9rem; background: var(--p-lilas);
}
.choix:nth-child(6n+1) .lettre { background: var(--p-rose); }
.choix:nth-child(6n+2) .lettre { background: var(--p-soleil); }
.choix:nth-child(6n+3) .lettre { background: var(--p-menthe); }
.choix:nth-child(6n+4) .lettre { background: var(--p-lilas); }
.choix:nth-child(6n+5) .lettre { background: var(--p-peche); }
.choix:nth-child(6n+6) .lettre { background: var(--p-ciel); }
.choix.bon { background: var(--tint-good); }
.choix.a-revoir { background: var(--tint-retry); }
.touche {
  min-height: 64px; font: 600 1.8rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.touche:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.touche.douce { background: var(--surface2); }
.touche.ok { background: var(--good); color: var(--on-good); }

/* ---------- 8. Réglages : interrupteur ---------- */
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--toucher); font-weight: 700; cursor: pointer; }
.interrupteur input { appearance: none; flex: none; width: 58px; height: 34px; margin: 0; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); position: relative; cursor: pointer; transition: background .2s; }
.interrupteur input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); transition: transform .2s var(--ressort); }
.interrupteur input:checked { background: var(--good); }
.interrupteur input:checked::after { transform: translateX(24px); }

/* ---------- 9. Texte à lire (applis de français) ---------- */
.texte-lecture {
  font-family: var(--lecture); font-size: 22px; font-weight: 600; line-height: 2;
  letter-spacing: .02em; word-spacing: .12em; max-width: 34ch;
}
.texte-lecture .ligne { display: block; padding: 0 10px; border-radius: 10px; }
.texte-lecture .ligne:nth-child(even) { background: var(--ligne-b); }
.syl-a { color: var(--syl-a); }
.syl-b { color: var(--syl-b); }
.muette { color: var(--muette); }
.son-cle { background: var(--son-cle); border-radius: 6px; box-shadow: 0 0 0 2px var(--son-cle); }

/* ---------- 10. Animations (désactivables) ---------- */
@keyframes apparait { from { transform: scale(.85); opacity: 0; } }
@keyframes bravo { 0% { transform: scale(1); } 30% { transform: scale(1.08) rotate(-2deg); } 55% { transform: scale(.97) rotate(1deg); } 80% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes non { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-10px) rotate(-3deg); } 40% { transform: translateX(9px) rotate(2.5deg); } 60% { transform: translateX(-6px) rotate(-1.5deg); } 80% { transform: translateX(3px) rotate(.5deg); } }
@keyframes saute { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 70% { transform: translateY(0) scale(1.06, .94); } 82% { transform: translateY(-10px) scale(.97, 1.03); } }
@keyframes flotte { 50% { transform: translateY(-12px) rotate(12deg); } }
@keyframes etoile { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx, 0), var(--dy, -80px)) scale(1) rotate(160deg); opacity: 0; } }
@keyframes arrive { 0% { transform: translateY(40px) scale(.6); opacity: 0; } 60% { transform: translateY(-8px) scale(1.05); opacity: 1; } 100% { transform: none; } }

.anim-apparait { animation: apparait .45s var(--ressort) both; }
.anim-bravo { animation: bravo .6s ease both; }          /* bonne réponse : la carte rebondit */
.anim-non { animation: non .5s ease both; }              /* erreur : la carte secoue la tête */
.anim-saute { animation: saute 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.anim-arrive { animation: arrive .7s var(--ressort) both; } /* entrée d'un personnage */

/* Petits dessins de fond ★ ♥ ✿ ✦ */
.deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--deco); }
.deco span { position: absolute; font-size: 22px; animation: flotte 7s ease-in-out infinite; }

/* Interrupteur « Animations » de l'appli : <html class="calme"> */
.calme *, .calme *::before, .calme *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ==========================================================================
   Tic-tac : styles propres à l'appli
   ========================================================================== */
:root {
  --aig-h: #2F4FE0;         /* petite aiguille (heures) : bleu */
  --aig-m: #C92A62;         /* grande aiguille (minutes) : framboise */
  --bande: #FCE6EF;         /* couronne des minutes */
  --et: #DDF0FF;            /* moitié « et » du cadran */
  --moins: #ECE5FF;         /* moitié « moins » du cadran */
}
@media (prefers-color-scheme: dark) {
  :root { --aig-h: #8FA4FF; --aig-m: #FF7FAE; --bande: #46263F; --et: #263A5E; --moins: #3A3264; }
}
html, body { height: 100%; }
body { min-height: 100dvh; }
.wrap { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.muted { color: var(--muted); }
p { margin: 0; }

/* ---------- Accueil ---------- */
.bonjour { font: 700 1.35rem var(--display); }
.mondes { display: grid; gap: 12px; }
.monde {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; text-align: left;
  width: 100%; padding: 12px 14px; cursor: pointer; color: var(--ink);
  border: var(--bord) solid var(--line); border-radius: var(--r-carte); box-shadow: var(--ombre-carte);
}
.monde:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--line); }
.monde .ico { font-size: 2rem; line-height: 1; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
.monde h2 { font-size: 1.2rem; }
.monde .sous { font-size: .9rem; color: var(--muted); font-weight: 700; }
.monde .trophee { font-size: 1.6rem; }
.m-m1 { background: var(--p-ciel); }
.m-m2 { background: var(--p-menthe); }
.m-m3 { background: var(--p-lilas); }
.m-test { background: var(--p-soleil); }
.etoiles-niv { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.etoiles-niv > span { font-size: .8rem; letter-spacing: -1px; padding: 0 5px; border-radius: 99px; background: var(--surface); border: 2px solid var(--line); line-height: 1.35; }
.etoile-on { color: #E8A600; }
.etoile-off { color: var(--muted); opacity: .35; }
.lien-parent { align-self: center; background: none; border: 0; color: var(--muted); text-decoration: underline; font: 700 .95rem var(--body); cursor: pointer; padding: 8px; min-height: 44px; }

/* ---------- Liste des niveaux ---------- */
.niveaux { display: grid; gap: 10px; }
.niveau {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 10px 14px; min-height: 64px; cursor: pointer; color: var(--ink);
  background: var(--surface); border: var(--bord) solid var(--line); border-radius: var(--r-btn); box-shadow: var(--ombre);
}
.niveau:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.niveau.conseil { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun), var(--ombre); }
.niveau .conseille { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; background: var(--sun); color: var(--on-sun); font-weight: 800; font-size: .8rem; }
.niveau .lettre { width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 12px; font: 700 1.2rem var(--display); }
.niveau:nth-child(6n+1) .lettre { background: var(--p-rose); }
.niveau:nth-child(6n+2) .lettre { background: var(--p-soleil); }
.niveau:nth-child(6n+3) .lettre { background: var(--p-menthe); }
.niveau:nth-child(6n+4) .lettre { background: var(--p-lilas); }
.niveau:nth-child(6n+5) .lettre { background: var(--p-peche); }
.niveau:nth-child(6n+6) .lettre { background: var(--p-ciel); }
.niveau b { font: 600 1.1rem var(--display); display: block; }
.niveau small { color: var(--muted); font-weight: 700; display: block; line-height: 1.25; }
.niveau .et3 { font-size: 1.1rem; white-space: nowrap; }

/* ---------- Écran de question ---------- */
body.joue .entete { display: none; }
body.joue .wrap { height: 100dvh; min-height: 0; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
#jeu { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.barre-jeu { display: flex; align-items: center; gap: 10px; flex: none; }
.barre-jeu .rond { width: 42px; height: 42px; font-size: 18px; }
.points { flex: 1; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.points i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line); background: var(--track); }
.points i.ok { background: var(--good); }
.points i.raté { background: var(--retry); }
.points i.ici { background: var(--sun); transform: scale(1.25); }
.consigne { flex: none; font: 700 1.25rem/1.2 var(--display); text-align: center; text-wrap: balance; display: flex; align-items: center; justify-content: center; gap: 8px; }
.consigne .cible { color: var(--action); white-space: nowrap; }
.consigne .moment { font-size: 1.6rem; }
.consigne .ecoute { flex: none; width: 40px; height: 40px; font-size: 18px; }
.histoire { font: 700 1.05rem/1.35 var(--body); text-align: left; }

.scene {
  position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-carte); transition: background .3s;
}
.scene.reussie { background: var(--tint-good); }
.scene.a-retenter { background: var(--tint-retry); }
.scene .horloge { height: 100%; width: auto; max-width: 100%; max-height: 100%; }
.scene .zone-droite { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 0; }
.droite { width: 100%; height: auto; max-height: 100%; overflow: visible; display: block; }
.mini-horloge { flex: 1 1 auto; min-height: 0; max-height: 170px; width: 100%; display: flex; justify-content: center; }
.mini-horloge .horloge { height: 100%; width: auto; max-width: 100%; }
.zone-droite > .dz { flex: none; width: 100%; }
.grande-consigne { font: 700 clamp(1.6rem, 8vw, 2.4rem)/1.2 var(--display); text-align: center; text-wrap: balance; padding: 8px; }
.astuce-jeu {
  position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 4;
  background: var(--sun); color: var(--on-sun); border: var(--bord) solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--line);
  padding: 8px 12px; font-weight: 800; font-size: 1rem; line-height: 1.3;
}
.astuce-jeu::before { content: '💡 '; }
.astuce-jeu b { font-family: var(--display); font-weight: 700; }
.astuce-jeu .bh { color: #1F3BC4; } .astuce-jeu .bm { color: #A81F50; }

.reponse { flex: none; display: flex; flex-direction: column; gap: 8px; }
.message { min-height: 1.35em; text-align: center; font: 700 1.1rem var(--display); }
.choix-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choix-grille.un { grid-template-columns: 1fr; }
.choix-grille .choix { justify-content: center; text-align: center; min-height: 54px; padding: 6px 10px; font-size: 1.15rem; line-height: 1.15; }
.choix-grille .choix.long { font-size: 1rem; }
.choix:disabled { cursor: default; }
.champs { display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 1.5rem var(--display); flex-wrap: wrap; }
.champ {
  min-width: 64px; height: 50px; padding: 0 10px; display: inline-grid; place-items: center;
  background: var(--surface); border: var(--bord) solid var(--line); border-radius: 14px; cursor: pointer;
  font: 700 1.6rem var(--display); font-variant-numeric: tabular-nums; color: var(--ink);
}
.champ.actif { box-shadow: 0 0 0 4px var(--sun); }
.champ.vide::after { content: '?'; color: var(--muted); opacity: .5; }
.pave { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.pave .touche { min-height: 52px; font-size: 1.5rem; padding: 0; }
.pave .touche.ok { background: var(--action); color: var(--on-action); font-size: 1.15rem; }
.aide-calcul { text-align: center; font: 700 1.1rem var(--display); color: var(--muted); }
.etape { text-align: center; font-weight: 800; }

/* ---------- Fin de série ---------- */
.fin { align-items: center; text-align: center; }
.gros-etoiles { font-size: 3rem; letter-spacing: 4px; }
.gros-etoiles .off { color: var(--track); }
.gros-etoiles .on { color: #E8A600; -webkit-text-stroke: 2px var(--line); }
.creature-fin { width: 150px; height: 150px; }
.creature-fin svg { width: 100%; height: 100%; overflow: visible; }
.scores { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-weight: 800; }

/* ---------- Carnet du parent ---------- */
.carnet table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.carnet td, .carnet th { padding: 6px 4px; border-bottom: 2px solid var(--track); text-align: left; }
.carnet td:last-child { text-align: right; white-space: nowrap; }
.jours { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.jours span { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--track); }
.jours span.on { background: var(--good); }
.zone-danger { display: grid; gap: 10px; }

/* ---------- Créature de récompense ---------- */
.buddy { position: absolute; right: -6px; bottom: -10px; width: 96px; height: 96px; z-index: 5; pointer-events: none; opacity: 0; }
.buddy.on { opacity: 1; animation: arrive .7s var(--ressort) both; }
.buddy svg { display: block; width: 100%; height: 100%; overflow: visible; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.confetti i { position: absolute; top: -16px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

/* ---------- Horloge (SVG) ---------- */
.horloge { display: block; touch-action: none; user-select: none; -webkit-user-select: none; overflow: visible; }
.horloge:focus-visible { outline: none; }
.horloge:focus-visible .h-cadran { stroke: var(--sun); stroke-width: 6; }
.h-ombre { fill: var(--line); }
.h-cadran { fill: var(--surface); stroke: var(--line); stroke-width: 3; }
.h-anneau { fill: none; stroke: var(--track); stroke-width: 2; }
.h-moities, .h-couronne { display: none; }
.avec-moities .h-moities, .avec-couronne .h-couronne { display: inline; }
.h-et { fill: var(--et); } .h-moins { fill: var(--moins); }
.h-mot { font: 800 17px var(--body); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.h-bande { fill: var(--bande); }
.h-min { font: 700 15px var(--display); fill: var(--aig-m); text-anchor: middle; dominant-baseline: central; }
.h-trait { stroke: var(--ink); stroke-width: 1.6; opacity: .55; stroke-linecap: round; }
.h-trait5 { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.h-num { font: 600 30px var(--display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.heures-bleues .h-num { fill: var(--aig-h); }
.h-tour { stroke: var(--line); stroke-linecap: round; }
.h-corps { stroke-linecap: round; }
.h-aig-h .h-corps { stroke: var(--aig-h); }
.h-aig-m .h-corps { stroke: var(--aig-m); }
.h-etiq { display: none; }
.avec-etiquettes .h-etiq { display: inline; }
.h-etiq rect { fill: var(--surface); stroke-width: 2.5; }
.h-etiq text { font: 800 12.5px var(--body); text-anchor: middle; dominant-baseline: central; }
.h-etiq-h rect { stroke: var(--aig-h); } .h-etiq-h text { fill: var(--aig-h); }
.h-etiq-m rect { stroke: var(--aig-m); } .h-etiq-m text { fill: var(--aig-m); }
.h-axe { fill: var(--line); } .h-axe2 { fill: var(--sun); }
.interactif { cursor: grab; }
.prise-h, .prise-m { cursor: grabbing; }
.prise-h .h-aig-h .h-tour, .prise-m .h-aig-m .h-tour { stroke: var(--sun); }
.h-compte { font: 700 22px var(--display); fill: var(--aig-m); stroke: var(--surface); stroke-width: 5; paint-order: stroke; text-anchor: middle; dominant-baseline: central; }
@keyframes clignote { 50% { opacity: .2; } }
.clignote { animation: clignote .7s ease-in-out 5; }

/* ---------- Droite des bonds (SVG) ---------- */
.d-ligne { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.d-point { fill: var(--surface); stroke: var(--line); stroke-width: 3; }
.d-point.pile { fill: var(--sun); }
.d-heure { font: 700 19px var(--display); fill: var(--ink); text-anchor: middle; }
.d-heure.inconnue { fill: var(--muted); }
.d-arc { fill: none; stroke: var(--aig-m); stroke-width: 3; stroke-linecap: round; }
.d-arc.vide { stroke: var(--muted); stroke-dasharray: 5 6; }
.d-fleche { fill: var(--aig-m); }
.d-bond { font: 700 18px var(--display); fill: var(--aig-m); text-anchor: middle; }
.d-bond.vide { fill: var(--muted); }
.d-total { font: 700 18px var(--display); fill: var(--ink); text-anchor: middle; }

@media (max-height: 620px) {
  .consigne { font-size: 1.1rem; }
  .pave .touche { min-height: 46px; }
  .champ { height: 44px; }
  .choix-grille .choix { min-height: 48px; }
  .barre-jeu .rond { width: 38px; height: 38px; }
}
.h-min.compte { fill: var(--ink); font-size: 19px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="entete">
    <a class="rond" href="/" aria-label="Mes applis" title="Mes applis">🏠</a>
    <h1 class="titre" id="titre">Tic-tac</h1>
    <button class="rond" type="button" id="btnReglages" aria-label="Réglages" title="Réglages">⚙</button>
  </header>

  <main>
    <!-- Accueil -->
    <section id="vAccueil" class="stack">
      <p class="bonjour" id="bonjour">Bonjour !</p>
      <button class="btn btn-action" type="button" id="btnSeance">⏰ Ma séance du jour</button>
      <div class="mondes" id="mondes"></div>
      <button class="lien-parent" type="button" id="btnParent">Carnet du parent</button>
    </section>

    <!-- Liste des niveaux d'un monde -->
    <section id="vNiveaux" class="stack" hidden>
      <div class="barre-jeu"><button class="rond" type="button" id="btnRetourNiv" aria-label="Retour">←</button><h2 id="titreMonde" style="flex:1"></h2></div>
      <div class="niveaux" id="niveaux"></div>
    </section>

    <!-- Question -->
    <section id="jeu" hidden>
      <div class="barre-jeu">
        <button class="rond" type="button" id="btnQuitter" aria-label="Arrêter la série">✕</button>
        <div class="points" id="points" aria-hidden="true"></div>
        <button class="rond" type="button" id="btnVoix" aria-label="Écouter" hidden>🔊</button>
      </div>
      <div class="consigne" id="consigne" aria-live="polite"></div>
      <div class="scene" id="scene">
        <div id="visuel" style="display:contents"></div>
        <div class="astuce-jeu" id="astuce" role="status" hidden></div>
        <div class="buddy" id="buddy" aria-hidden="true"><svg viewBox="0 0 100 100" id="buddyArt"></svg></div>
      </div>
      <div class="reponse" id="reponse"></div>
    </section>

    <!-- Fin de série -->
    <section id="vFin" class="stack fin" hidden>
      <h2 id="finTitre">Bravo !</h2>
      <div class="gros-etoiles" id="finEtoiles" aria-hidden="true"></div>
      <p id="finTexte"></p>
      <ul class="scores" id="finScores"></ul>
      <div class="creature-fin" id="finCreature" aria-hidden="true"><svg viewBox="0 0 100 100"></svg></div>
      <button class="btn btn-action" type="button" id="btnContinuer">Continuer</button>
      <button class="btn" type="button" id="btnRetourFin">Retour</button>
    </section>

    <!-- Réglages -->
    <section id="vReglages" class="stack" hidden>
      <h2>Réglages</h2>
      <div class="carte stack" style="gap:4px">
        <label class="interrupteur">Sons<input type="checkbox" id="pSon"></label>
        <label class="interrupteur">Animations<input type="checkbox" id="pAnim"></label>
        <label class="interrupteur">Voix (lire l'heure à voix haute)<input type="checkbox" id="pVoix"></label>
        <label class="interrupteur">Vibrations<input type="checkbox" id="pVibre"></label>
      </div>
      <p class="muted" id="infoVoix" hidden>Pas de voix française sur cet appareil.</p>
      <button class="btn btn-action" type="button" id="btnFermerReglages">C'est bon</button>
    </section>

    <!-- Carnet du parent -->
    <section id="vParent" class="stack carnet" hidden>
      <h2>Carnet du parent</h2>
      <div class="carte stack" style="gap:8px">
        <div class="etiquette">Les 14 derniers jours</div>
        <div class="jours" id="pJours"></div>
        <p id="pResumeJours" class="muted"></p>
      </div>
      <div class="carte stack" style="gap:8px">
        <div class="etiquette">Erreurs les plus fréquentes (7 jours)</div>
        <table id="pErreurs"></table>
      </div>
      <div class="carte stack" style="gap:8px">
        <div class="etiquette">Étoiles par niveau</div>
        <table id="pEtoiles"></table>
      </div>
      <button class="btn btn-action" type="button" id="btnCopier">Copier le résumé</button>
      <p class="muted" id="copieInfo" hidden></p>
      <div class="zone-danger">
        <button class="btn" type="button" id="btnZero">Remettre à zéro</button>
        <button class="btn btn-soleil" type="button" id="btnZeroOui" hidden>Oui, tout effacer</button>
      </div>
      <button class="btn" type="button" id="btnFermerParent">Retour</button>
    </section>
  </main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- Stockage (tout reste sur l'appareil) ---------- */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var CLES = { prefs: 'marc.tictac.prefs', prog: 'marc.tictac.prog', rev: 'marc.tictac.revisions', journal: 'marc.tictac.journal' };
  var prefs, prog, revisions, journal;
  function charger() {
    prefs = store.get(CLES.prefs, {}) || {};
    ['son', 'anim', 'voix', 'vibre'].forEach(function (k) { if (typeof prefs[k] !== 'boolean') prefs[k] = true; });
    prog = store.get(CLES.prog, {}) || {};
    MONDES.forEach(function (m) {
      if (!Array.isArray(prog[m.id])) prog[m.id] = [];
      m.niveaux.forEach(function (n, i) { var v = +prog[m.id][i]; prog[m.id][i] = v >= 0 && v <= 3 ? v : 0; });
    });
    prog.tout = !!prog.tout;
    revisions = store.get(CLES.rev, []);
    if (!Array.isArray(revisions)) revisions = [];
    revisions = revisions.filter(function (r) { return r && typeof r.cle === 'string' && GEN[r.cle.split(':')[0]]; });
    journal = store.get(CLES.journal, {}) || {};
    if (!journal.jours || typeof journal.jours !== 'object') journal.jours = {};
    if (!Array.isArray(journal.erreurs)) journal.erreurs = [];
  }
  function sauver() {
    store.set(CLES.prefs, prefs); store.set(CLES.prog, prog);
    store.set(CLES.rev, revisions); store.set(CLES.journal, journal);
  }

  /* ---------- Petits outils ---------- */
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(l) { return l[Math.floor(Math.random() * l.length)]; }
  function melange(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function hm(h, m) { return h + 'h' + p2(m); }                         // 13h35, 0h00
  function duree(min) {                                                  // 3 h 50 min, 30 min, 2 h
    var h = Math.floor(min / 60), m = min % 60;
    if (!h) return m + ' min';
    return h + ' h' + (m ? ' ' + m + ' min' : '');
  }
  function h12(h) { h = ((h % 12) + 12) % 12; return h === 0 ? 12 : h; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function jour(decalage) {
    var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + (decalage || 0));
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }
  function ajouteJours(j, n) {
    var p = j.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2], 12);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }
  // L'heure dite à voix haute : « il est treize heures trente-cinq »
  function heureParlee(h, m) {
    var t = h === 0 ? 'zéro heure' : h === 1 ? 'une heure' : h + ' heures';
    if (h === 21) t = 'vingt et une heures';
    return t + (m ? ' ' + m : '');
  }

  /* ==========================================================================
     Les mondes, les niveaux et les questions
     Chaque générateur rend une question : { cle, consigne, visuel, etapes: [...] }.
     Une étape : { texte, rep, bonne, juge(v), diag(v), fautes, apresOk(), solution(), explique }
     rep : { type: 'choix', options: [{ t, v }] } | { type: 'clavier', champs: [{ u, max }] }
         | { type: 'placer' } | { type: 'toucher' }
     ========================================================================== */
  var MONDES = [
    { id: 'm1', ico: '🕐', nom: "Lire l'heure", couleur: 'm-m1', niveaux: [
      { nom: 'Les deux aiguilles', desc: 'Qui dit les heures, qui dit les minutes ?' },
      { nom: 'La petite aiguille', desc: 'Lire les heures avec la petite aiguille seule' },
      { nom: 'La grande aiguille', desc: 'Compter les minutes' },
      { nom: "Lire l'heure", desc: 'Les deux aiguilles ensemble' },
      { nom: 'Matin ou après-midi', desc: 'De 0 à 24 h' },
      { nom: "Dire l'heure", desc: 'Et quart, et demie, moins le quart… (bonus)' }
    ] },
    { id: 'm2', ico: '⏳', nom: 'Les durées', couleur: 'm-m2', niveaux: [
      { nom: 'La bonne unité', desc: 'Secondes, minutes, heures, jours, mois, années, siècles' },
      { nom: 'Les équivalences', desc: '1 h = 60 min, 1 jour = 24 h…' },
      { nom: 'Vers la petite unité', desc: 'On multiplie : 2 jours = 48 h' },
      { nom: 'Vers la grande unité', desc: 'On divise : 72 h = 3 jours' },
      { nom: 'Défis', desc: 'Combien d’heures dans une semaine ?' }
    ] },
    { id: 'm3', ico: '📏', nom: 'Calculer une durée', couleur: 'm-m3', niveaux: [
      { nom: "Jusqu'à l'heure pile", desc: '14h40 → 15h00' },
      { nom: 'Un seul bond', desc: 'Heures entières, ou dans la même heure' },
      { nom: 'Les trois bonds', desc: '20h45 → 23h15' },
      { nom: 'Passer minuit', desc: '23h30 → 3h20' },
      { nom: 'Quelle heure sera-t-il ?', desc: '2h50 + 20 min' },
      { nom: 'Petites histoires', desc: 'Films, trajets, recettes…' }
    ] }
  ];
  var LETTRES = 'ABCDEF';

  // Types d'erreurs reconnues (§ 6 du cahier des charges)
  var ERREURS = {
    inversees: 'Aiguilles inversées',
    tropTot: 'Petite aiguille lue trop tôt',
    reveil: 'Minutes lues « comme un réveil »',
    matinSoir: 'Matin / après-midi',
    cent: 'Heure comptée sur 100 minutes',
    equivalence: 'Mauvaise équivalence',
    operation: 'Multiplier au lieu de diviser (ou l’inverse)',
    bondOublie: 'Bond oublié sur la droite',
    etMoins: '« Et » et « moins » mélangés',
    autre: 'Autre erreur'
  };

  function choix(valeurs, fmt) { return { type: 'choix', options: melange(valeurs).map(function (v) { return { t: fmt ? fmt(v) : String(v), v: v }; }) }; }
  function clavierHM() { return { type: 'clavier', champs: [{ u: 'h', max: 2 }, { u: 'min', max: 2 }] }; }
  function clavier1(u, max) { return { type: 'clavier', champs: [{ u: u, max: max || 2 }] }; }
  function unique(l) { return l.filter(function (x, i) { return l.indexOf(x) === i; }); }
  function differents(base, n, fab) {               // n valeurs distinctes de base, tirées par fab()
    var l = [base], essais = 0;
    while (l.length < n && essais++ < 200) { var v = fab(); if (l.indexOf(v) < 0 && v != null) l.push(v); }
    return l;
  }

  /* ---------- Horloges : outils ---------- */
  function horloge(h, m, o) { return { type: 'horloge', h: h, m: m, o: o || {} }; }
  // Des aiguilles bien séparées, pour qu'on voie les deux
  function heureLisible(pas, hMin, hMax) {
    for (var i = 0; i < 50; i++) {
      var h = rnd(hMin || 1, hMax || 12), m = pas >= 60 ? 0 : rnd(0, 59 / pas | 0) * pas;
      var aH = ((h % 12) + m / 60) * 30, aM = m * 6, d = Math.abs(aH - aM) % 360;
      if (d > 180) d = 360 - d;
      if (d > 35) return { h: h, m: m };
    }
    return { h: 3, m: 40 };
  }
  // Lecture d'une horloge au clavier : 1h35 et 13h35 sont acceptées, 12h ou 0h aussi
  function memeHeure12(a, b) { return ((a % 12) + 12) % 12 === ((b % 12) + 12) % 12; }

  var GEN = {};

  /* ---------- Monde 1 ---------- */
  GEN['m1-1'] = function (idx, v) {
    v = v || pick(['toucherH', 'toucherM', 'grande', 'petite', 'quelle', 'quelleM']);
    var t = heureLisible(5), aides = idx < 3;
    var q = { cle: 'm1-1:' + v, visuel: horloge(t.h, t.m, { etiquettes: aides && v.indexOf('toucher') === 0 ? false : aides, heuresBleues: aides }) };
    var e;
    if (v === 'toucherH' || v === 'toucherM') {
      var cible = v === 'toucherH' ? 'h' : 'm';
      q.consigne = 'Touche l’aiguille qui indique les <span class="cible">' + (cible === 'h' ? 'heures' : 'minutes') + '</span>.';
      q.visuel.o.toucher = true;
      e = { rep: { type: 'toucher' }, bonne: cible, fautes: { inversees: cible === 'h' ? 'm' : 'h' } };
      e.diag = function () { return 'inversees'; };
    } else if (v === 'grande' || v === 'petite') {
      q.consigne = 'La ' + v + ' aiguille indique…';
      var b = v === 'grande' ? 'les minutes' : 'les heures';
      e = { rep: choix(['les heures', 'les minutes']), bonne: b, fautes: { inversees: b === 'les heures' ? 'les minutes' : 'les heures' } };
      e.diag = function () { return 'inversees'; };
    } else {
      var quoi = v === 'quelle' ? 'heures' : 'minutes';
      if (v === 'quelleFiche') quoi = 'heures';
      q.consigne = 'Quelle aiguille indique les <span class="cible">' + quoi + '</span> ?';
      var bb = quoi === 'heures' ? 'la petite' : 'la grande';
      e = { rep: choix(['la petite', 'la grande']), bonne: bb, fautes: { inversees: bb === 'la petite' ? 'la grande' : 'la petite' } };
      e.diag = function () { return 'inversees'; };

  }
  function resume() {
    var l = ['Tic-tac (lire l’heure) — résumé du ' + jour().split('-').reverse().join('/')];
    var n = joursJoues().filter(function (x) { return x.on; }).length;
    l.push('Jours de travail sur 14 jours : ' + n);
    MONDES.forEach(function (m) {
      l.push(m.nom + ' : ' + m.niveaux.map(function (nv, i) { return LETTRES[i] + ' ' + prog[m.id][i] + '★'; }).join(', '));
    });
    var er = erreursRecentes();
    if (er.length) l.push('Erreurs fréquentes (7 jours) : ' + er.slice(0, 4).map(function (x) { return (ERREURS[x[0]] || x[0]) + ' (' + x[1] + ')'; }).join(', '));
    return l.join('\n');
  }

  /* ==========================================================================
     Événements
     ========================================================================== */
  $('#mondes').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-monde]'); if (!b) return;
    if (b.dataset.monde === 'test') demarrer('test'); else afficherNiveaux(b.dataset.monde);
  });
  $('#niveaux').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-niv]'); if (!b || b.disabled) return;
    demarrer('niveau', b.dataset.niv);
  });
  $('#btnRetourNiv').addEventListener('click', afficherAccueil);
  $('#btnSeance').addEventListener('click', function () { demarrer('seance'); });
  $('#btnQuitter').addEventListener('click', function () { if (hasSpeech) speechSynthesis.cancel(); SER = null; Q = null; if (mondeOuvert) afficherNiveaux(mondeOuvert); else afficherAccueil(); });
  $('#btnVoix').addEventListener('click', function () { if (Q && Q.voix) dire(Q.voix); });
  $('#reponse').addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    if (t.id === 'btnSuivant') return suivante();
    if (t.id === 'btnValider') return valider();
    if (t.id === 'btnEtapeSuite') { Q.attente = false; $('#astuce').hidden = true; $('#scene').classList.remove('a-retenter'); Q.etape++; return afficherEtape(); }
    if (t.dataset.k != null) return touche(t.dataset.k);
    if (t.dataset.champ != null && saisie) { saisie.actif = +t.dataset.champ; return majChamps(); }
    if (t.dataset.i != null && Q && !Q.fini && !Q.attente) { var e = etapeCourante(); return soumettre(e.rep.options[+t.dataset.i].v); }
  });
  $('#astuce').addEventListener('click', function () { if (!Q || !Q.fini) $('#astuce').hidden = true; });
  document.addEventListener('keydown', function (ev) {
    if (ecran !== 'jeu' || !Q) return;
    if (Q.fini && ev.key === 'Enter' && document.activeElement && document.activeElement.id !== 'btnSuivant') { ev.preventDefault(); return suivante(); }
    if (!saisie || Q.fini) return;
    if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); touche(ev.key); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); touche('del'); }
    else if (ev.key === 'Enter') { ev.preventDefault(); touche('ok'); }
    else if (ev.key === 'Tab' && saisie.vals.length > 1 && document.activeElement && document.activeElement.classList.contains('touche')) { /* navigation normale */ }
  });
  $('#btnContinuer').addEventListener('click', function () {
    var s = SER && SER.suite; if (!s) return afficherAccueil();
    if (s.seance) return demarrer('seance');
    if (s.monde) return afficherNiveaux(s.monde);
    demarrer('niveau', s.niv);
  });
  $('#btnRetourFin').addEventListener('click', function () { if (SER && SER.sorte === 'niveau' && mondeOuvert) afficherNiveaux(mondeOuvert); else afficherAccueil(); });

  // Réglages
  var avantReglages = 'vAccueil';
  $('#btnReglages').addEventListener('click', function () {
    avantReglages = ecran === 'vReglages' ? avantReglages : ecran;
    $('#pSon').checked = prefs.son; $('#pAnim').checked = prefs.anim; $('#pVoix').checked = prefs.voix; $('#pVibre').checked = prefs.vibre;
    trouveVoix();
    montrer('vReglages');
  });
  [['pSon', 'son'], ['pAnim', 'anim'], ['pVoix', 'voix'], ['pVibre', 'vibre']].forEach(function (x) {
    $('#' + x[0]).addEventListener('change', function (ev) { prefs[x[1]] = ev.target.checked; sauver(); appliquerCalme(); if (x[1] === 'voix' && prefs.voix) dire('Il est 13 heures 35'); });
  });
  $('#btnFermerReglages').addEventListener('click', function () {
    if (avantReglages === 'vNiveaux' && mondeOuvert) afficherNiveaux(mondeOuvert);
    else if (avantReglages === 'vParent') afficherParent();
    else afficherAccueil();
  });

  // Carnet du parent
  $('#btnParent').addEventListener('click', afficherParent);
  $('#btnFermerParent').addEventListener('click', afficherAccueil);
  $('#btnZero').addEventListener('click', function () { $('#btnZeroOui').hidden = false; $('#btnZeroOui').focus(); });
  $('#btnZeroOui').addEventListener('click', function () {
    MONDES.forEach(function (m) { prog[m.id] = m.niveaux.map(function () { return 0; }); });
    prog.tout = false; revisions = []; journal = { jours: {}, erreurs: [] };
    sauver(); afficherParent();
  });
  $('#btnCopier').addEventListener('click', function () {
    var t = resume(), info = $('#copieInfo');
    function montre(m) { info.textContent = m; info.hidden = false; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { montre('Résumé copié : tu peux le coller dans un message.'); }, function () { montre(t); });
    } else montre(t);
  });

  /* ==========================================================================
     Point d'accès pour les tests automatiques
     ========================================================================== */
  window.__tictac = {
    etat: function () {
      var e = Q && Q.etapes[Q.etape];
      return { ecran: ecran, serie: SER && { sorte: SER.sorte, niv: SER.niv, i: SER.i, n: SER.n, res: SER.res.slice() }, question: Q && { cle: Q.cle, etape: Q.etape, nbEtapes: Q.etapes.length, type: e && e.rep.type, bonne: e && e.bonne, fautes: e && e.fautes, fini: !!Q.fini, rate: !!Q.rate } };
    },
    lancer: function (niv) { demarrer('niveau', niv); },
    seance: function () { demarrer('seance'); },
    test: function () { demarrer('test'); },
    repondre: function (v) {
      var e = etapeCourante();
      if (e.rep.type === 'placer') { H.regler(v.h, v.m); return valider(); }
      if (e.rep.type === 'clavier') { saisie.vals = v.map(String); return valider(); }
      soumettre(v);
    },
    juste: function () { this.repondre(etapeCourante().bonne); },
    astuce: function () { var a = $('#astuce'); return a.hidden ? null : a.dataset.type || null; },
    suivant: function () { var b = $('#btnSuivant') || $('#btnEtapeSuite'); if (b) b.click(); },
    horloge: function () { return H && H.lire(); },
    niveaux: function () { return MONDES.map(function (m) { return m.niveaux.map(function (n, i) { return m.id + '-' + (i + 1); }); }); },
    gen: function (niv, idx, v) { return GEN[niv](idx || 0, v); },
    prog: function () { return JSON.parse(JSON.stringify(prog)); }
  };

  /* ---------- Démarrage ---------- */
  charger();
  appliquerCalme();
  afficherAccueil();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
